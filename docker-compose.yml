# Le socle : Ollama et son dashboard d'administration (Nimbus).
#
# Les applications qui consomment les modeles (chat, agents, voix...) vivent
# dans leurs propres projets et rejoignent le reseau `llm-net` pour atteindre
# Ollama par son nom : http://ollama:11434. Le socle ne les connait pas.

services:
  ollama:
    image: ollama/ollama:0.34.0
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
      - ./modelfiles:/modelfiles:ro
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_FLASH_ATTENTION=true
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_CONTEXT_LENGTH=20000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  dashboard:
    build: ./dashboard
    container_name: llm-dashboard
    restart: unless-stopped
    depends_on:
      - ollama
    volumes:
      # Le dashboard réécrit les prompts et régénère les Modelfiles.
      - ./modelfiles:/stack/modelfiles
      - ./prompts:/stack/prompts
      # Services a surveiller (config/services.json, facultatif).
      - ./config:/stack/config:ro
    ports:
      # Pas d'authentification : accessible depuis la loopback et le VPN
      # uniquement, jamais depuis le LAN (192.168.1.0/24).
      - "127.0.0.1:8080:8080"
      - "10.8.0.1:8080:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - STACK_DIR=/stack
      - GPU_TOTAL_VRAM_GB=24

networks:
  # Reseau par defaut du socle, avec un nom fixe pour que les autres projets
  # puissent s'y brancher (`networks: llm-net: external: true`).
  default:
    name: llm-net

volumes:
  ollama_data:
