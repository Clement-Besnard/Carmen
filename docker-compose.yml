services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
      - ./modelfiles:/modelfiles:ro
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_FLASH_ATTENTION=true
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      - ollama
    volumes:
      - webui_data:/app/backend/data
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=true

  dashboard:
    build: ./dashboard
    container_name: llm-dashboard
    restart: unless-stopped
    depends_on:
      - ollama
    volumes:
      # Le dashboard réécrit les prompts et régénère les Modelfiles.
      - ./modelfiles:/stack/modelfiles
      - ./prompts:/stack/prompts
    ports:
      # Pas d'authentification : accessible depuis la loopback et le VPN
      # uniquement, jamais depuis le LAN (192.168.1.0/24).
      - "127.0.0.1:8080:8080"
      - "10.8.0.1:8080:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - STACK_DIR=/stack
      - GPU_TOTAL_VRAM_GB=24

  langflow:
    image: langflowai/langflow:1.11.0   # pas "langflow/langflow", ce repo n'existe pas
    container_name: langflow
    restart: unless-stopped
    depends_on:
      - ollama
    volumes:
      - langflow_data:/app/langflow
    ports:
      - "127.0.0.1:7860:7860"
      - "10.8.0.1:7860:7860"
    environment:
      - LANGFLOW_CONFIG_DIR=/app/langflow
      - LANGFLOW_AUTO_LOGIN=false
      - LANGFLOW_SUPERUSER=admin
      - LANGFLOW_SUPERUSER_PASSWORD=${LANGFLOW_SUPERUSER_PASSWORD}
      - LANGFLOW_SECRET_KEY=${LANGFLOW_SECRET_KEY}
      # Importe la variable comme "global variable" utilisable dans les composants
      - OLLAMA_BASE_URL=http://ollama:11434
      - LANGFLOW_VARIABLES_TO_GET_FROM_ENVIRONMENT=OLLAMA_BASE_URL

volumes:
  ollama_data:
  langflow_data:
  webui_data:
    external: true
    name: open-webui