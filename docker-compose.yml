services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
      - ./modelfiles:/modelfiles:ro
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_FLASH_ATTENTION=true
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      - ollama
      - langflow-bridge
    volumes:
      - webui_data:/app/backend/data
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=true
      # Les flows Langflow arrivent comme des modèles via la passerelle.
      - ENABLE_OPENAI_API=true
      - OPENAI_API_BASE_URLS=http://langflow-bridge:7861/v1
      - OPENAI_API_KEYS=langflow

  dashboard:
    build: ./dashboard
    container_name: llm-dashboard
    restart: unless-stopped
    depends_on:
      - ollama
    volumes:
      # Le dashboard réécrit les prompts et régénère les Modelfiles.
      - ./modelfiles:/stack/modelfiles
      - ./prompts:/stack/prompts
    ports:
      # Pas d'authentification : accessible depuis la loopback et le VPN
      # uniquement, jamais depuis le LAN (192.168.1.0/24).
      - "127.0.0.1:8080:8080"
      - "10.8.0.1:8080:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - STACK_DIR=/stack
      - GPU_TOTAL_VRAM_GB=24

  langflow:
    image: langflowai/langflow:1.11.0   # pas "langflow/langflow", ce repo n'existe pas
    container_name: langflow
    restart: unless-stopped
    depends_on:
      - ollama
    volumes:
      - langflow_data:/app/langflow
    ports:
      - "127.0.0.1:7860:7860"
      - "10.8.0.1:7860:7860"
    environment:
      - LANGFLOW_CONFIG_DIR=/app/langflow
      # Pas d'écran de login ni de clé d'API : Langflow n'écoute que sur la
      # loopback et le VPN, comme le dashboard.
      - LANGFLOW_AUTO_LOGIN=true
      - LANGFLOW_SKIP_AUTH_AUTO_LOGIN=true
      # Pas de LANGFLOW_SECRET_KEY : Langflow en génère une et la persiste dans
      # le volume langflow_data. La fixer à la main casserait les variables
      # chiffrées si elle changeait.
      # La protection SSRF de Langflow bloque les IP privées : sans cette liste,
      # les composants refusent de joindre les autres conteneurs de la stack.
      - LANGFLOW_SSRF_ALLOWED_HOSTS=ollama,langflow-bridge,localhost,127.0.0.1
      # Importe la variable comme "global variable" utilisable dans les composants
      - OLLAMA_BASE_URL=http://ollama:11434
      - LANGFLOW_VARIABLES_TO_GET_FROM_ENVIRONMENT=OLLAMA_BASE_URL

  # Traduit l'API OpenAI (ce que parle Open WebUI) vers /api/v1/run de Langflow.
  langflow-bridge:
    build: ./langflow-bridge
    container_name: langflow-bridge
    restart: unless-stopped
    depends_on:
      - langflow
    ports:
      # Exposé seulement pour le débogage ; Open WebUI l'atteint par le réseau interne.
      - "127.0.0.1:7861:7861"
    environment:
      - LANGFLOW_URL=http://langflow:7860
      - INCLUDE_EXAMPLE_FLOWS=false

volumes:
  ollama_data:
  langflow_data:
  webui_data:
    external: true
    name: open-webui